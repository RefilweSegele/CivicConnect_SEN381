name: CivicConnect CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Backend Dependencies
        run: |
          cd civicconnect-backend
          npm install

      - name: Run Backend Tests
        env:
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/civicconnect_test
          JWT_SECRET: ci_test_secret_key
        run: |
          cd civicconnect-backend
          npm test --if-present

  frontend-tests:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        run: |
          cd civicconnect-frontend
          npm install

      - name: Run Frontend Tests
        run: |
          cd civicconnect-frontend
          npm test --if-present
