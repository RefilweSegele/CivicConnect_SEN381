<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0E2240">
    <title>CivicConnect - Service Requests Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .app-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 1.5rem 1rem;
        }
        .logo-mark {
            width: 100%;
            max-width: 120px;
            height: auto;
            max-height: 25vh;
            margin-bottom: 0.75rem;
        }
        .app-header h1, .app-header p {
            margin: 0.25rem 0;
        }
        .roles {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <header class="app-header">
        <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="14" fill="#F5B700" />
            <path d="M32 11 54 26H10Z" fill="#0E2240" />
            <rect x="14" y="30" width="6" height="16" rx="1.5" fill="#0E2240" />
            <rect x="29" y="30" width="6" height="16" rx="1.5" fill="#0E2240" />
            <rect x="44" y="30" width="6" height="16" rx="1.5" fill="#0E2240" />
            <rect x="9" y="49" width="46" height="6" rx="2" fill="#0E2240" />
        </svg>
        
        <h1>CivicConnect</h1>
        <p>Service Request &amp; Monitoring Portal</p>
        
        <!-- Dynamic header navigation (Role switcher or Logout) -->
        <nav class="roles" aria-label="User navigation" id="navRoles"></nav>
    </header>

    <main class="container">
        <div id="apiBanner" class="api-error" hidden></div>
        
        <!-- Authentication Container (Login / Sign Up) -->
        <div id="authContainer" class="card" hidden>
            <h2 id="authTitle">Login to CivicConnect</h2>
            <p class="card-lead" id="authSubtitle">Enter your credentials to access your account.</p>
            <div class="roles" style="margin-bottom: 1rem; justify-content: flex-start;">
                <button type="button" id="tabLogin" class="btn-secondary" style="padding: 0.4rem 1rem;">Login</button>
                <button type="button" id="tabSignup" class="btn-secondary" style="padding: 0.4rem 1rem; background: #6b7a8c;">Sign Up</button>
            </div>
            <form id="authForm">
                <div id="nameGroup" class="form-group" hidden>
                    <label for="authName">Full Name *</label>
                    <input id="authName" name="name" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="authEmail">Email Address *</label>
                    <input type="email" id="authEmail" name="email" required placeholder="user@civicconnect.co.za">
                </div>
                <div class="form-group">
                    <label for="authPassword">Password *</label>
                    <input type="password" id="authPassword" name="password" required placeholder="••••••••">
                </div>
                <div id="roleGroup" class="form-group" hidden>
                    <label for="authRole">Role *</label>
                    <select id="authRole" name="role">
                        <option value="resident">Resident / Requester</option>
                        <option value="staff">Staff</option>
                        <option value="supervisor">Supervisor</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit" id="authSubmitBtn">Login</button>
            </form>
            <div id="authError" class="feedback-msg error" style="margin-top: 1rem;"></div>
        </div>

        <!-- Main Dashboard View Container -->
        <div id="view"></div>
    </main>

    <script type="module" src="../src/app.js"></script>
</body>
</html>
